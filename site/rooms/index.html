<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>THE ROOMS</title>
<style>
html,body{margin:0;height:100%;background:#000;color:#9a948a;font:14px/1.5 "Courier New",monospace;overflow:hidden}
#canvas{position:absolute;inset:0;width:100%;height:100%;display:block;background:#000;outline:none}
#load{position:absolute;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5;transition:opacity 1.2s}
#static{position:absolute;inset:0;width:100%;height:100%;opacity:.35}
#load h1{position:relative;font-weight:400;letter-spacing:.5em;font-size:clamp(22px,5vw,54px);color:#cfc9bd;margin:0 0 .6em .5em;text-shadow:0 0 14px #000}
#msg{position:relative;color:#6d675e;min-height:1.5em;text-align:center;padding:0 16px}
#go{position:relative;margin-top:1.4em;background:#000;color:#cfc9bd;border:1px solid #6d675e;padding:.7em 2em;font:inherit;letter-spacing:.3em;cursor:pointer}
#go:hover{background:#1a1713}
#bar{position:relative;width:min(320px,70vw);height:2px;background:#222;margin-top:1em}
#bar i{display:block;height:100%;width:0;background:#8f8a7e}
#credit{position:absolute;top:6px;left:0;right:0;text-align:center;font-size:11px;color:#4a463f;z-index:6;pointer-events:none}
#credit a{color:#6d675e;pointer-events:auto}
</style></head><body>
<canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
<div id="load">
  <canvas id="static"></canvas>
  <h1>THE ROOMS</h1>
  <div id="msg">&nbsp;</div>
  <div id="bar" hidden><i></i></div>
  <button id="go" hidden>ENTER</button>
</div>
<div id="credit">Engine: FTEQW (GPL) &middot; Assets: LibreQuake (BSD) &middot; Rooms, QuakeC &amp; voice: wirehead.agency &middot; <a href="CREDITS.txt" target="_blank">licences</a></div>
<script src="rooms.js"></script>
</body></html>
