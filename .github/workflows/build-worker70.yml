name: build-worker70
# Cloud build for the 70B GPTQ worker (Samantha meme arm) — no local docker.
# Builds live/Dockerfile.worker70 and pushes to ghcr.

on:
  push:
    branches: [master]
    paths: ["live/Dockerfile.worker70", "live/worker.py", "live/server.py",
            "live/requirements.txt"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./live
          file: ./live/Dockerfile.worker70
          push: true
          tags: |
            ghcr.io/terrafying/saw-chamber-worker-70b:v2
            ghcr.io/terrafying/saw-chamber-worker-70b:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
