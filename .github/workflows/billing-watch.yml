name: billing-watch
# Every 30 min: RunPod balance / spend rate / forgotten pods / queued-but-no-
# workers endpoints, OpenRouter + ElevenLabs credit (when their secrets
# exist), and site + relay health. Opens ONE issue labelled billing-watch
# while anything needs attention (updates it, never spams), closes it when
# clear. See scripts/billing_watch.py for thresholds.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: billing-watch
  cancel-in-progress: true
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check balances, spend and health
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/billing_watch.py --issue
