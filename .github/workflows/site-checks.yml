name: site-checks
# Fails the push if a page links to a missing file, the published sha256s
# drift from the downloads, or anything secret-looking ships in a tarball
# or is tracked in the repo. Static checks only; nothing is deployed.

on:
  push:
    paths: ["site/**", "scripts/check_site.py", ".github/workflows/site-checks.yml", ".gitignore"]
  pull_request:
    paths: ["site/**", "scripts/check_site.py", ".github/workflows/site-checks.yml", ".gitignore"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_site.py
